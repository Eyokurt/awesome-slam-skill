<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 640" width="1280" height="640">
  <defs>
    <style>
      .bg { fill: #16171a; }
      .grid-dot { fill: #26292e; }
      .border { stroke: #2d3036; stroke-width: 1; fill: none; }
      .pill-bg { fill: #1e2024; stroke: #2d3036; stroke-width: 1; }
      .text-title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, monospace; font-size: 60px; font-weight: 700; fill: #f4f4f5; }
      .text-sub { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 26px; font-weight: 400; fill: #a1a1aa; }
      .text-desc { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 19px; fill: #828691; }
      .text-desc2 { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 19px; fill: #646973; }
      .text-badge { font-family: "Consolas", monospace; font-size: 14px; fill: #a1a1aa; letter-spacing: 0.5px; }
      .text-metric-val { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 20px; font-weight: 700; fill: #f4f4f5; }
      .text-metric-lbl { font-family: "Consolas", monospace; font-size: 12px; fill: #71717a; }
      .wire-line { stroke: #788291; stroke-width: 2; fill: none; }
      .obs-line { stroke: #2d343e; stroke-width: 1; fill: none; }
      .loop-arc { stroke: #3c506e; stroke-width: 1.5; stroke-dasharray: 4,4; fill: none; }
    </style>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#26292e" />
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="1280" height="640" class="bg" />
  <rect width="1280" height="640" fill="url(#grid)" />

  <!-- Outer Frame -->
  <rect x="24" y="24" width="1232" height="592" rx="4" class="border" />

  <!-- Pill Badge -->
  <rect x="72" y="70" width="345" height="32" rx="6" class="pill-bg" />
  <circle cx="86" cy="86" r="4" fill="#60a5fa" />
  <text x="100" y="91" class="text-badge">ANTIGRAVITY SKILL • RESEARCH ARCHIVE</text>

  <!-- Main Title & Description -->
  <text x="72" y="180" class="text-title">awesome-slam</text>
  <text x="72" y="240" class="text-sub">Simultaneous Localization and Mapping</text>
  <text x="72" y="280" class="text-desc">Visual SLAM  •  Visual-Inertial Odometry  •  LiDAR SLAM</text>
  <text x="72" y="315" class="text-desc2">Lie Theory  •  Factor Graphs  •  Non-Linear Least Squares</text>

  <!-- Metric Tiles -->
  <g transform="translate(72, 480)">
    <rect x="0" y="0" width="175" height="76" rx="6" class="pill-bg" />
    <text x="16" y="32" class="text-metric-val">111 PAPERS</text>
    <text x="16" y="56" class="text-metric-lbl">Curated Offline Library</text>

    <rect x="189" y="0" width="175" height="76" rx="6" class="pill-bg" />
    <text x="205" y="32" class="text-metric-val">10 MODULES</text>
    <text x="205" y="56" class="text-metric-lbl">Domain Decision Matrices</text>

    <rect x="378" y="0" width="175" height="76" rx="6" class="pill-bg" />
    <text x="394" y="32" class="text-metric-val">CC0 1.0 / MIT</text>
    <text x="394" y="56" class="text-metric-lbl">Public Domain &amp; Open</text>

    <rect x="567" y="0" width="175" height="76" rx="6" class="pill-bg" />
    <text x="583" y="32" class="text-metric-val">~519 MB</text>
    <text x="583" y="56" class="text-metric-lbl">Complete PDF Archive</text>
  </g>

  <!-- Right Side Minimalist SLAM Trajectory Graph -->
  <!-- Observation rays -->
  <line x1="980" y1="140" x2="1010" y2="260" class="obs-line" />
  <line x1="1050" y1="120" x2="1070" y2="230" class="obs-line" />
  <line x1="1120" y1="150" x2="1140" y2="240" class="obs-line" />
  <line x1="1020" y1="180" x2="960" y2="310" class="obs-line" />
  <line x1="1070" y1="320" x2="1150" y2="360" class="obs-line" />
  <line x1="1030" y1="400" x2="1020" y2="440" class="obs-line" />
  <line x1="910" y1="390" x2="880" y2="420" class="obs-line" />
  <line x1="990" y1="470" x2="950" y2="445" class="obs-line" />

  <!-- Loop closure dashed arc -->
  <path d="M 880 420 Q 1020 280 1150 360" class="loop-arc" />
  <text x="960" y="490" class="text-metric-lbl" fill="#64748b">LOOP CLOSURE (SIM(3))</text>

  <!-- Odometry Trajectory -->
  <path d="M 880 420 L 920 360 L 960 310 L 1010 260 L 1070 230 L 1140 240 L 1170 290 L 1150 360 L 1090 410 L 1020 440 L 950 445 L 890 425" class="wire-line" />

  <!-- Sparse 3D Landmarks -->
  <g fill="#a0aec0">
    <circle cx="980" cy="140" r="3" />
    <circle cx="1050" cy="120" r="3" />
    <circle cx="1120" cy="150" r="3" />
    <circle cx="920" cy="220" r="3" />
    <circle cx="1020" cy="180" r="3" />
    <circle cx="1150" cy="200" r="3" />
    <circle cx="960" cy="280" r="3" />
    <circle cx="1070" cy="320" r="3" />
    <circle cx="1120" cy="380" r="3" />
    <circle cx="910" cy="390" r="3" />
    <circle cx="1030" cy="400" r="3" />
    <circle cx="990" cy="470" r="3" />
  </g>

  <!-- Keyframe Coordinate Axes (RGB) -->
  <!-- KF 0 -->
  <g transform="translate(880, 420)">
    <circle cx="0" cy="0" r="4" fill="#16171a" stroke="#60a5fa" stroke-width="2" />
    <line x1="0" y1="0" x2="12" y2="-6" stroke="#ef4444" stroke-width="2" />
    <line x1="0" y1="0" x2="-6" y2="-12" stroke="#22c55e" stroke-width="2" />
    <line x1="0" y1="0" x2="8" y2="10" stroke="#3b82f6" stroke-width="2" />
  </g>
  <!-- KF 2 -->
  <g transform="translate(960, 310)">
    <circle cx="0" cy="0" r="4" fill="#16171a" stroke="#60a5fa" stroke-width="2" />
    <line x1="0" y1="0" x2="12" y2="-6" stroke="#ef4444" stroke-width="2" />
    <line x1="0" y1="0" x2="-6" y2="-12" stroke="#22c55e" stroke-width="2" />
    <line x1="0" y1="0" x2="8" y2="10" stroke="#3b82f6" stroke-width="2" />
  </g>
  <!-- KF 4 -->
  <g transform="translate(1070, 230)">
    <circle cx="0" cy="0" r="4" fill="#16171a" stroke="#60a5fa" stroke-width="2" />
    <line x1="0" y1="0" x2="12" y2="-6" stroke="#ef4444" stroke-width="2" />
    <line x1="0" y1="0" x2="-6" y2="-12" stroke="#22c55e" stroke-width="2" />
    <line x1="0" y1="0" x2="8" y2="10" stroke="#3b82f6" stroke-width="2" />
  </g>
  <!-- KF 6 -->
  <g transform="translate(1170, 290)">
    <circle cx="0" cy="0" r="4" fill="#16171a" stroke="#60a5fa" stroke-width="2" />
    <line x1="0" y1="0" x2="12" y2="-6" stroke="#ef4444" stroke-width="2" />
    <line x1="0" y1="0" x2="-6" y2="-12" stroke="#22c55e" stroke-width="2" />
    <line x1="0" y1="0" x2="8" y2="10" stroke="#3b82f6" stroke-width="2" />
  </g>
  <!-- KF 8 -->
  <g transform="translate(1090, 410)">
    <circle cx="0" cy="0" r="4" fill="#16171a" stroke="#60a5fa" stroke-width="2" />
    <line x1="0" y1="0" x2="12" y2="-6" stroke="#ef4444" stroke-width="2" />
    <line x1="0" y1="0" x2="-6" y2="-12" stroke="#22c55e" stroke-width="2" />
    <line x1="0" y1="0" x2="8" y2="10" stroke="#3b82f6" stroke-width="2" />
  </g>
  <!-- KF 10 -->
  <g transform="translate(950, 445)">
    <circle cx="0" cy="0" r="4" fill="#16171a" stroke="#60a5fa" stroke-width="2" />
    <line x1="0" y1="0" x2="12" y2="-6" stroke="#ef4444" stroke-width="2" />
    <line x1="0" y1="0" x2="-6" y2="-12" stroke="#22c55e" stroke-width="2" />
    <line x1="0" y1="0" x2="8" y2="10" stroke="#3b82f6" stroke-width="2" />
  </g>
</svg>